# Pre-flight checks, run before a UAT suite so that a failure inside the suite is
# a real failure rather than an under-deployed model.
#
# MODEL, NIFI_APP and TRAEFIK_APP are exported by the `preflight` just recipe.
# TRAEFIK_APP is empty when ingress is not enabled, and its check is skipped.
command:
  nifi-active:
    exec: >-
      juju wait-for application --model "{{ .Env.MODEL }}" "{{ .Env.NIFI_APP }}"
      --query='name == "{{ .Env.NIFI_APP }}" && status == "active"' --timeout=10m
    exit-status: 0
    timeout: 660000
{{ if .Env.TRAEFIK_APP }}
  traefik-active:
    exec: >-
      juju wait-for application --model "{{ .Env.MODEL }}" "{{ .Env.TRAEFIK_APP }}"
      --query='name == "{{ .Env.TRAEFIK_APP }}" && status == "active"' --timeout=10m
    exit-status: 0
    timeout: 660000
{{ end }}
