[project]
name = "charmed-nifi-uats"
version = "2.10"
# nipyapi publishes classifiers up to 3.12 only, so the runner pins that
# interpreter rather than inheriting the host's.
requires-python = ">=3.12,<3.13"

[project.optional-dependencies]
uats = [
	"pytest>=8.0",
	"jubilant>=1.5.0",
	"nipyapi>=1.7.0",
]

lint = [
	"ruff>=0.12.7",
	"codespell>=2.3.0",
]

format = [
	"ruff>=0.12.7",
]

[tool.setuptools.packages.find]
include = ["tests*"]

[tool.ruff]
target-version = "py312"
src = ["tests", "."]
line-length = 99

[tool.ruff.lint]
select = ["E", "W", "F", "C", "N", "D", "I001"]
ignore = [
	"D107", # Missing docstring in __init__
	"D203",
	"D213",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
	"D1",   # Undocumented public elements; test names carry the intent
	"D417",
]

[tool.ruff.lint.flake8-copyright]
author = "Canonical Ltd."
notice-rgx = "Copyright\\s\\d{4}([-,]\\d{4})*\\s+"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
minversion = "8.0"
log_cli_level = "INFO"
addopts = "--tb=native --verbose"
