name: UATs

on:
  pull_request:
    paths-ignore:
      - '**.md'
  schedule:
    # Nightly against the channel head, offset from the top of the hour.
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "Charmhub channel to test against"
        required: true
        default: "2.10/edge"
        type: choice
        options:
          - 2.10/edge
          - 2.10/beta
          - 2.10/candidate
          - 2.10/stable
      revision:
        description: "Charm revision to pin (optional, defaults to the channel head)"
        required: false
        type: string

permissions:
  contents: read

env:
  MODEL: nifi-uats

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo snap install astral-uv --classic
          sudo snap install just --classic

      - name: Lint python code
        run: just lint

  terraform:
    name: Terraform checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo snap install terraform --classic
          sudo snap install just --classic

      - name: Check formatting and validate
        run: just validate

  uats:
    name: UATs (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix:
        # One entry per tox env. Scenario suites are added by their own tickets.
        suite:
          - framework
      fail-fast: false
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.suite }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    steps:
      - uses: actions/checkout@v5

      - name: Maximize runner disk
        uses: jlumbroso/free-disk-space@v1.3.1

      - name: Set up operator environment
        run: |
          set -euo pipefail

          sudo snap install concierge --classic
          # The k8s preset already enables the load balancer Traefik needs, and
          # installs jq; only the snaps this repo adds are listed here.
          sudo -E concierge prepare -p k8s --extra-snaps=astral-uv,just,terraform

          mkdir -p ~/.kube
          sudo k8s kubectl config view --raw > ~/.kube/config

          # FIXME: install from a snap once goss publishes one.
          GOSS_VERSION="v0.4.10"
          goss_base_url="https://github.com/goss-org/goss/releases/download/${GOSS_VERSION}"
          curl -fL "${goss_base_url}/goss_${GOSS_VERSION#v}_linux_x86_64.tar.gz" \
            | sudo tar xz -C /usr/local/bin goss
          sudo chmod +rx /usr/local/bin/goss

      - name: Deploy Charmed NiFi
        run: just deploy "${MODEL}" "${{ inputs.channel || '2.10/edge' }}" "${{ inputs.revision || '' }}"

      - name: Run the ${{ matrix.suite }} suite
        run: just uats-suite "${{ matrix.suite }}" "${MODEL}"

      - name: Collect artifacts
        if: failure()
        run: just collect-artifacts "${MODEL}" artifacts

      - name: Upload artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.suite }}-artifacts
          path: artifacts/
          retention-days: 7
